spring.application.name=proposta.app
# Carrega o .env da raiz do repositório ao rodar localmente (ignorado se não existir)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:proposta}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=${SERVER_PORT:8081}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:4200}

rabbitmq.propostapendente.exchange=proposta-pendente.ex
rabbitmq.propostaconcluida.exchange=proposta-concluida.ex
rabbit.queue.proposta.concluida=proposta-concluida.ms-analise-credito
rabbitmq.propostaDLXconcluida.exchange=proposta-pedente-dlx.ex
